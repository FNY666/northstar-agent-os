name: Northstar tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Sidecar and run contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        working-directory: components/northstar-codex-sidecar
        run: python -m py_compile sidecar.py transport.py service.py sidecar_socket.py tests/test_sidecar.py
      - name: Unit tests
        working-directory: components/northstar-codex-sidecar
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile run contract
        working-directory: components/northstar-run-contract
        run: python -m py_compile contract.py binding.py adapter.py audit.py policy.py tests/test_contract.py tests/test_integration_contract.py tests/test_audit.py tests/test_policy.py
      - name: Run contract tests
        working-directory: components/northstar-run-contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Packaging smoke
        # The contract is stdlib-only: `pip install .` must yield importable
        # modules from any directory, with no PYTHONPATH tricks.
        working-directory: components/northstar-run-contract
        run: |
          python -m pip install --quiet .
          cd /tmp
          python -c "import contract, binding, adapter; print('northstar-run-contract imports OK')"
          python -c "import contract; assert contract.SCHEMA_VERSION; print('schema', contract.SCHEMA_VERSION)"
      - name: Install contract dependency
        # Every declared dependency is resolved from this repository until the
        # components are published to an index; pip installs by local path.
        working-directory: components/northstar-host
        run: python -m pip install --quiet ../northstar-run-contract
      - name: Compile host component
        working-directory: components/northstar-host
        run: python -m py_compile authorization.py workspace.py host_audit.py host_policy.py tests/test_authorization.py tests/test_workspace.py tests/test_integration_host.py tests/test_host_audit.py tests/test_host_policy.py
      - name: Host component tests
        working-directory: components/northstar-host
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Host packaging smoke
        # `pip install .` must resolve the declared northstar-run-contract
        # dependency (installed above) and import from any directory.
        working-directory: components/northstar-host
        run: |
          python -m pip install --quiet .
          cd /tmp
          python -c "import authorization, workspace; print('northstar-host imports OK')"
      - name: Install durable run dependencies
        working-directory: components/northstar-durable-run
        run: python -m pip install --quiet ../northstar-run-contract ../northstar-host
      - name: Compile durable run component
        working-directory: components/northstar-durable-run
        run: python -m py_compile durable_contract.py event_store.py action_gateway.py runner.py verifier.py trace_metrics.py evaluation.py durable_audit.py tests/test_*.py
      - name: Durable run component tests
        working-directory: components/northstar-durable-run
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Durable run packaging smoke
        working-directory: components/northstar-durable-run
        run: |
          python -m pip install --quiet .
          cd /tmp
          python -c "import durable_contract, action_gateway, event_store, runner, verifier, trace_metrics, evaluation; print('northstar-durable-run imports OK')"
      - name: Install agent interop dependencies
        working-directory: components/northstar-agent-interop
        run: python -m pip install --quiet ../northstar-run-contract ../northstar-host
      - name: Compile agent interop component
        working-directory: components/northstar-agent-interop
        run: python -m py_compile interop_contract.py handoff.py interop_adapter.py canary.py process_adapter.py process_backend.py remote_worker.py tests/test_*.py
      - name: Agent interop component tests
        working-directory: components/northstar-agent-interop
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Agent interop packaging smoke
        working-directory: components/northstar-agent-interop
        run: |
          python -m pip install --quiet .
          cd /tmp
          python -c "import interop_contract, handoff, interop_adapter, canary, process_adapter, process_backend; print('northstar-agent-interop imports OK')"
      - name: Shell syntax
        working-directory: components/northstar-codex-sidecar
        run: sh -n install.sh rollback.sh

  agent-runtime:
    name: Agent runtime (offline unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/northstar-agent-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-tracing.txt
      - name: Compile
        run: |
          # Every module the component ships, by glob rather than by hand: a curated list
          # here silently stopped covering new modules the moment they landed, which is the
          # opposite of what a compile step is for.
          python -m py_compile *.py providers/*.py tools/*.py \
            tests/support.py tests/fixtures/*.py tests/test_*.py
      - name: Unit tests
        # No API key and no network: the scripted provider is the only model, and
        # the sidecar integration test starts a real listener on a Unix socket.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Setup Node (TypeScript face)
        # The face is source-only and its suite spawns this component's CLI, so node is a test
        # runner here, not a build tool: no `npm install`, no lockfile, no registry contact.
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TypeScript face tests
        run: |
          node --version
          cd sdk-ts && node --test "test/*.test.ts"
      - name: CLI smoke
        # The public entry points must work from the installed layout: version,
        # environment self-check, dry-run (no request), the offline demo, and the
        # public governance bench (denial / injection / budget — offline, no key).
        run: |
          python -m cli --version
          python -m cli doctor --workspace . | grep -q "ready to run"
          python -m cli run --workspace . --prompt smoke --scripted-text ok --dry-run | grep -q "no request was sent"
          python -m cli bench --json | python -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["failed"]==0, r'
          sh ../../examples/demo/run_offline.sh >/dev/null
      - name: Packaging smoke
        # `pip install .` must yield a working console script and importable
        # modules from any directory (lazy SDK imports keep this offline-safe).
        run: |
          python -m pip install --quiet --no-deps .
          cd /tmp
          northstar-agent-runtime --version
          northstar --version
          northstar-agent-runtime doctor --workspace /tmp | grep -q "ready to run"
          northstar bench --json | python -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["failed"]==0, r'
          python -c "import cli, loop, tools, tools.verify_invariants, governance_bench, memory, product_path; print('northstar-agent-runtime imports OK')"
      - name: Guard verification
        # Reverting each core guard in a throwaway copy must turn its test red;
        # the untouched copy must stay green. ~1-2 minutes.
        run: python3 tools/verify_invariants.py
  documentation:
    name: Repository documentation (structure + build + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Structure tests
        # Component README "Concepts, guides and API reference" link targets,
        # examples index coverage, API page headers/module lists, plus the
        # pre-existing documentation structure tests.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and link check
        # Docstring API pages must be byte-fresh against the committed ones,
        # and every internal markdown link must resolve. Pure standard library,
        # so this runs offline with no dependency install.
        run: python3 tests/docbuild.py verify
