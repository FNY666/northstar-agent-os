name: Northstar Agent OS

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        working-directory: components/northstar-codex-sidecar
        run: python -m py_compile sidecar.py transport.py service.py sidecar_socket.py tests/test_sidecar.py
      - name: Unit tests
        working-directory: components/northstar-codex-sidecar
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile run contract
        working-directory: components/northstar-run-contract
        run: python -m py_compile contract.py binding.py adapter.py tests/test_contract.py tests/test_integration_contract.py
      - name: Run contract tests
        working-directory: components/northstar-run-contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile agent runtime
        working-directory: components/northstar-agent-runtime
        run: python -m py_compile loop.py hooks.py permissions.py budget.py tools.py compaction.py sessions.py agents.py tracing.py sidecar_client.py cli.py providers/base.py providers/anthropic.py providers/scripted.py tests/test_scripted_provider.py tests/test_anthropic_provider.py tests/test_budget.py tests/test_events.py tests/test_hooks.py tests/test_permissions.py tests/test_workspace_sandbox.py tests/test_compaction.py tests/test_sessions.py tests/test_subagents.py tests/test_tracing.py tests/test_loop_limits.py tests/test_sidecar_integration.py tests/test_cli.py
      - name: Install agent runtime requirements
        run: pip install -r components/northstar-agent-runtime/requirements.txt -r components/northstar-agent-runtime/requirements-tracing.txt
      - name: Agent runtime tests
        working-directory: components/northstar-agent-runtime
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        working-directory: components/northstar-codex-sidecar
        run: sh -n install.sh rollback.sh
