name: Northstar Codex Sidecar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        working-directory: components/northstar-codex-sidecar
        run: python -m py_compile sidecar.py transport.py service.py sidecar_socket.py tests/test_sidecar.py
      - name: Unit tests
        working-directory: components/northstar-codex-sidecar
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile run contract
        working-directory: components/northstar-run-contract
        run: python -m py_compile contract.py binding.py adapter.py tests/test_contract.py tests/test_integration_contract.py
      - name: Run contract tests
        working-directory: components/northstar-run-contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile host component
        working-directory: components/northstar-host
        run: PYTHONPATH=../northstar-run-contract python -m py_compile authorization.py workspace.py tests/test_authorization.py tests/test_workspace.py tests/test_integration_host.py
      - name: Host component tests
        working-directory: components/northstar-host
        run: PYTHONPATH=../northstar-run-contract python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile durable run component
        working-directory: components/northstar-durable-run
        run: python -m py_compile durable_contract.py event_store.py action_gateway.py runner.py verifier.py trace_metrics.py evaluation.py planner_adapter.py openai_compatible_planner.py repo_read.py workspace_list.py workspace_write.py agent_entry.py agent_benchmark.py agent_driver.py live_run.py live_benchmark.py completion_contract_v2.py completion_replay.py completion_batch_replay.py completion_workspace_snapshot.py completion_coverage.py mutation_check.py completion_shadow.py completion_live_shadow.py completion_advisory.py live_shadow_run.py tests/test_*.py
      - name: Durable run component tests
        working-directory: components/northstar-durable-run
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile agent interop component
        working-directory: components/northstar-agent-interop
        run: PYTHONPATH=../northstar-run-contract:../northstar-host python -m py_compile interop_contract.py handoff.py interop_adapter.py canary.py tests/test_*.py
      - name: Agent interop component tests
        working-directory: components/northstar-agent-interop
        run: PYTHONPATH=.:../northstar-run-contract:../northstar-host python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        working-directory: components/northstar-codex-sidecar
        run: sh -n install.sh rollback.sh
