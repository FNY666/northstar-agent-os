name: Security contract tests

on:
  pull_request:
  push:
  merge_group:

# This workflow is intentionally read-only: it neither signs nor emits artifacts.
permissions:
  contents: read

jobs:
  security-contract-tests:
    name: security-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install contract-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --requirement
          security/requirements.txt "pytest==9.1.1" "PyYAML==6.0.3"
      - name: Run existing security and native contract unit tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          targets = [Path("security/tests"),
                     Path("security/cicd-evidence-integration/tests"),
                     Path("security/cicd-evidence-integration/security-evidence-contract/tests")]
          native_tests = Path("security/native_tests")
          if native_tests.is_dir():
              targets.extend(sorted(native_tests.rglob("test_*.py")))
          print("pytest targets:", ", ".join(str(target) for target in targets))
          subprocess.run(
              [sys.executable, "-m", "pytest", "-q", *(str(target) for target in targets)],
              check=True,
          )
          PY
      - name: Run fixed local attack-defense lab when supplied
        run: |
          lab='security/run-native-security-lab.py'
          if [ -f "$lab" ]; then
            python "$lab"
          else
            echo '::notice title=Native attack-defense lab not present::Only existing contract unit tests ran; no native scan, isolation, or signing result is claimed.'
          fi
