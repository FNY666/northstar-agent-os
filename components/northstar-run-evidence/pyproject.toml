[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-run-evidence"
description = "Strict evidence records and hash-chain primitives for Northstar Agent OS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
version = "0.1.0.dev0"
keywords = ["agent", "evidence", "audit", "hash-chain", "northstar"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[tool.setuptools]
py-modules = [
    "evidence_contract",
    "evidence_chain",
    "evidence_store",
    "sealed_receipt",
    "audit_adapter",
    "evidence_cli",
]
