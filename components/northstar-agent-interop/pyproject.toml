[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-agent-interop"
description = "Backend-neutral local candidate for Northstar Agent OS: signed Agent attestations, narrowed handoff grants, opaque context envelopes, and typed adapter receipts. Does not yet connect real Codex, Claude Code, Hermes, Cursor, or OpenBot backends."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
version = "0.1.0.dev0"
keywords = ["agent", "interop", "handoff", "attestation", "northstar"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
# The handoff and canary flows verify host authorization grants (northstar-host)
# over contract-signed bindings (northstar-run-contract). Install both from this
# repository first; bare `pip install .` works once they are published.
dependencies = ["northstar-run-contract", "northstar-host"]

[tool.setuptools]
py-modules = [
    "canary",
    "handoff",
    "interop_adapter",
    "interop_contract",
    "process_adapter",
    "process_backend",
]
